<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GG Auction to Sheets</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 12px;
        width: 320px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      .hint {
        font-size: 12px;
        color: #666;
        margin-bottom: 8px;
      }
      input,
      button,
      select {
        width: 100%;
        box-sizing: border-box;
        margin-top: 8px;
      }
      button {
        padding: 10px;
        border: none;
        border-radius: 6px;
        background: #1976d2;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>지지옥션 → 스프레드시트</h1>
    <p class="hint">Apps Script Web App URL을 저장한 뒤 수집 버튼을 누르세요.</p>

    <label for="webhookUrl">Apps Script Web App URL</label>
    <input id="webhookUrl" type="url" placeholder="https://script.google.com/.../exec" />

    <label for="scopeMode">수집 범위</label>
    <select id="scopeMode">
      <option value="visible">현재 화면(보이는 목록)</option>
      <option value="all">페이지 순회(다음 버튼 기반)</option>
    </select>

    <button id="saveBtn" type="button">URL 저장</button>
    <button id="crawlBtn" type="button">수집 시작</button>

    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
